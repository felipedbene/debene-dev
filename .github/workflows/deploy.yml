name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, homelab]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build and push image to ghcr
        run: |
          img=ghcr.io/${{ github.repository_owner }}/blog-debene-dev
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo /usr/local/bin/nerdctl login ghcr.io -u ${{ github.actor }} --password-stdin
          sudo /usr/local/bin/nerdctl build --no-cache \
            -t "$img:${{ github.sha }}" \
            -t "$img:latest" .
          sudo /usr/local/bin/nerdctl push "$img:${{ github.sha }}"
          sudo /usr/local/bin/nerdctl push "$img:latest"

      - name: Write kubeconfig from secret
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "::error::KUBE_CONFIG_B64 secret is not set — add it with: base64 < ~/.kube/config | gh secret set KUBE_CONFIG_B64 -R ${{ github.repository }}"
            exit 1
          fi
          kc="$RUNNER_TEMP/kubeconfig"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$kc"
          chmod 600 "$kc"
          echo "kubeconfig: $(wc -c < "$kc") bytes"
          echo "cluster server: $(KUBECONFIG="$kc" kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          # Hand the path to later steps via the job env (so paths can't drift).
          echo "KUBECONFIG=$kc" >> "$GITHUB_ENV"

      - name: Ensure ghcr pull secret
        run: |
          # Lets the cluster pull the (private) ghcr image. Refreshed each run.
          kubectl -n blog create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: |
          # Reconcile spec (replicas: 1) to the manifest, then pin the deployment
          # to THIS run's immutable, registry-backed image. Pulling from ghcr by
          # SHA means any node runs exactly what we just built — no dependence on
          # a node-local image cache (the old nerdctl-only path served stale builds).
          img=ghcr.io/${{ github.repository_owner }}/blog-debene-dev
          kubectl apply -f k8s/deployment.yaml
          kubectl -n blog set image deployment/blog blog="$img:${{ github.sha }}"
          kubectl -n blog rollout status deployment/blog --timeout=180s

      - name: Purge Cloudflare cache
        run: |
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "✅ Cache purged"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy ${{ job.status }} 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://debene.dev" >> $GITHUB_STEP_SUMMARY
