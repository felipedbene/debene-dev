name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: debene-dev
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          path: debene-dev

      - name: Install Hugo
        run: |
          if ! command -v hugo &> /dev/null; then
            echo "📦 Installing Hugo..."
            HUGO_VERSION=0.139.3
            wget -q https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
            sudo tar -xzf hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz -C /usr/local/bin/ hugo
            rm hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
            echo "✅ Hugo installed"
          else
            echo "✅ Hugo already installed"
          fi
          hugo version
        working-directory: .

      - name: Build site with Hugo
        run: |
          echo "🏗️ Building site..."
          hugo --minify
          echo "✅ Site built to public/"
          ls -la public/ | head -10

      - name: Deploy to NFS
        run: |
          echo "📦 Mounting NFS if needed..."
          
          # Ensure /tank/media is mounted
          if ! mountpoint -q /tank/media 2>/dev/null; then
            sudo mkdir -p /tank/media
            sudo mount -t nfs -o proto=rdma,port=20049 172.16.0.20:/mnt/tank/media /tank/media || \
              sudo mount -t nfs 10.0.10.101:/mnt/tank/media /tank/media
            echo "✅ Mounted /tank/media"
          else
            echo "✅ /tank/media already mounted"
          fi
          
          echo ""
          echo "🚀 Deploying to /tank/media/blog/..."
          
          # Clear old content
          sudo rm -rf /tank/media/blog/*
          
          # Copy new content
          sudo cp -r public/* /tank/media/blog/
          sudo chmod -R 755 /tank/media/blog/
          
          echo "✅ Deploy complete!"
          echo ""
          echo "📊 Files deployed:"
          ls -la /tank/media/blog/ | head -10

      - name: Purge Cloudflare cache
        run: |
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "✅ Cache purged"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy ${{ job.status }} 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Method:** Hugo static site + NFS + Nginx" >> $GITHUB_STEP_SUMMARY
          echo "**Location:** /tank/media/blog/" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://debene.dev" >> $GITHUB_STEP_SUMMARY
