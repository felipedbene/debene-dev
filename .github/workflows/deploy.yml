name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: debene-dev
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          path: debene-dev

      - name: Install tools
        run: |
          set -e
          
          # Install kubectl
          if ! command -v kubectl &> /dev/null; then
            echo "📦 Installing kubectl..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
            rm kubectl
          fi
          
          # Install nerdctl
          if ! command -v nerdctl &> /dev/null; then
            echo "📦 Installing nerdctl..."
            NERDCTL_VERSION=1.7.6
            curl -LO "https://github.com/containerd/nerdctl/releases/download/v${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz"
            sudo tar Cxzvf /usr/local/bin nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz
            rm nerdctl-${NERDCTL_VERSION}-linux-amd64.tar.gz
          fi
          
          echo "✅ Tools installed:"
          kubectl version --client --short || kubectl version --client
          nerdctl version
        working-directory: .

      - name: Setup kubeconfig
        run: |
          # Create .kube directory
          mkdir -p /home/runner/.kube
          
          # Check if we can access host kubeconfig via volume mount
          if [ -f /kubeconfig/config ]; then
            echo "✅ Using mounted kubeconfig"
            cp /kubeconfig/config /home/runner/.kube/config
          elif [ -f /root/.kube/config ]; then
            echo "✅ Copying from /root/.kube/config"
            sudo cp /root/.kube/config /home/runner/.kube/config
            sudo chown runner:runner /home/runner/.kube/config
          else
            echo "⚠️  No kubeconfig found, trying with service account"
          fi
          
          chmod 600 /home/runner/.kube/config 2>/dev/null || true
          
          # Test kubectl access
          kubectl get nodes || echo "⚠️  kubectl not working yet"
        working-directory: .

      - name: Login to Docker Hub
        run: |
          # Use docker if nerdctl doesn't work
          if command -v nerdctl &> /dev/null && sudo nerdctl --namespace k8s.io ps &>/dev/null; then
            echo "Using nerdctl"
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | \
              sudo nerdctl --namespace k8s.io login \
                -u fdebene \
                --password-stdin
          else
            echo "Using docker"
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | \
              sudo docker login \
                -u fdebene \
                --password-stdin
          fi

      - name: Build multi-arch image
        run: |
          # Try nerdctl first, fallback to docker buildx
          if command -v nerdctl &> /dev/null && sudo nerdctl --namespace k8s.io ps &>/dev/null; then
            echo "Building with nerdctl"
            sudo nerdctl --namespace k8s.io build \
              --platform linux/amd64,linux/arm64 \
              --no-cache \
              -t fdebene/blog-debene-dev:latest \
              -t fdebene/blog-debene-dev:${{ github.sha }} \
              .
          else
            echo "Building with docker buildx"
            sudo docker buildx create --use --name multiarch || true
            sudo docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --push \
              -t fdebene/blog-debene-dev:latest \
              -t fdebene/blog-debene-dev:${{ github.sha }} \
              .
          fi

      - name: Push images to Docker Hub
        run: |
          # Only push if using nerdctl (docker buildx already pushed)
          if command -v nerdctl &> /dev/null && sudo nerdctl --namespace k8s.io ps &>/dev/null; then
            echo "Pushing with nerdctl"
            sudo nerdctl --namespace k8s.io push \
              --all-platforms \
              fdebene/blog-debene-dev:latest
            sudo nerdctl --namespace k8s.io push \
              --all-platforms \
              fdebene/blog-debene-dev:${{ github.sha }}
          else
            echo "✅ Images already pushed by docker buildx"
          fi

      - name: Update deployment image
        run: |
          kubectl set image deployment/blog -n blog \
            blog=fdebene/blog-debene-dev:${{ github.sha }}
          kubectl rollout status deployment/blog -n blog --timeout=120s

      - name: Purge Cloudflare cache
        run: |
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "✅ Cache purged"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy ${{ job.status }} 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** fdebene/blog-debene-dev:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Hub:** https://hub.docker.com/r/fdebene/blog-debene-dev" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://debene.dev" >> $GITHUB_STEP_SUMMARY
